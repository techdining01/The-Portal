{% extends "shop_base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/shop.css' %}">
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<div class="container py-4">

    <h2 class="text-center mb-4 fw-bold">BrillsPay Shop</h2>

    <div class="row g-4">
        {% for product in products %}
        <div class="col-6 col-md-4 col-lg-3"
             data-aos="fade-up"
             data-aos-duration="700"
             data-aos-delay="{{ forloop.counter0 }}00">

            <div class="product-card shadow-sm rounded-4 bg-white p-2">

                <div class="product-image-wrapper">
                    {% if product.image %}
                        <img src="{{ product.image.url }}" class="product-image" alt="{{ product.name }}">
                    {% else %}
                        <img src="{% static 'shop/img/no-image.png' %}" class="product-image" alt="No image">
                    {% endif %}
                </div>

                <div class="p-2">
                    <h6 class="fw-bold">{{ product.name }}</h6>
                    <p class="text-muted small">{{ product.category.name }}</p>
                    <p class="fw-semibold text-primary">₦{{ product.price|floatformat:2 }}</p>

                    <button class="btn btn-dark btn-sm w-100 add-to-cart-btn"
                            data-id="{{ product.id }}">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>
        {% endfor %}
    </div>

</div>

<script>
AOS.init();

// GSAP hover animation
document.querySelectorAll(".product-card").forEach(card => {
    card.addEventListener("mouseenter", () => {
        gsap.to(card, { scale: 1.04, duration: .25 });
    });
    card.addEventListener("mouseleave", () => {
        gsap.to(card, { scale: 1, duration: .25 });
    });
});

// AJAX Add to Cart
document.querySelectorAll(".add-to-cart-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        const id = btn.dataset.id;

        fetch(`/shop/cart/add/${id}/`, {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
                "X-Requested-With": "XMLHttpRequest"
            }
        })
        .then(res => res.json())
        .then(data => {
            btn.innerHTML = "Added ✓";
            btn.classList.remove("btn-dark");
            btn.classList.add("btn-success");

            setTimeout(() => {
                btn.innerHTML = "Add to Cart";
                btn.classList.remove("btn-success");
                btn.classList.add("btn-dark");
            }, 2000);
        });
    });
});
</script>

{% endblock %}
