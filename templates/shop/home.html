{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-4">School Shop</h2>
  <div class="row g-3">
    {% for item in items %}
    <div class="col-md-4">
      <div class="card h-100 shadow-sm">
        {% if item.image %}
        <img src="{{ item.image.url }}" class="card-img-top" style="height:220px; object-fit:cover;">
        {% endif %}
        <div class="card-body">
          <h5>{{ item.name }}</h5>
          <p class="text-muted small">{{ item.description|truncatechars:100 }}</p>
          <p class="fw-bold">₦{{ item.price|intcomma }}</p>
          <div class="d-flex gap-2">
            <a href="{% url 'shop:detail' item.slug %}" class="btn btn-outline-primary btn-sm">View</a>
            <button class="btn btn-primary btn-sm add-to-cart" data-id="{{ item.id }}">Add to cart</button>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
<script>
document.querySelectorAll('.add-to-cart').forEach(btn=>{
  btn.addEventListener('click', async ()=> {
    const id = btn.dataset.id;
    const res = await fetch("{% url 'shop:add_to_cart' %}", {
      method: 'POST',
      headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'item_id=' + id + '&qty=1'
    });
    const j = await res.json();
    if (j.ok) { alert('Added to cart'); location.reload(); }
  });
});
</script>
{% endblock %}
