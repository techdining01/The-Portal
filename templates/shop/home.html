{% extends "shop_base.html" %}
{% load static %}
{% load humanize %}
{% block content %}
<!-- <div class="container py-5"> -->
    <h2 data-aos="fade-up">School Shop</h1>

        <div class="row g-3">
            {% for item in items %}
            <div class="col-md-3" data-aos="fade-up" data-aos-delay="{{ forloop.counter0|add:1 }}00">
                <div class="card h-50 shadow-sm">
                    {% if item.image %}
                    <img src="{{ item.image.url }}" class="card-img-top" style="height:220px; object-fit:center;">
                    {% endif %}
                    <div class="card-body">
                        <h5 class="card-title gsap-fade-up fw-bold">{{ item.name }}</h5>
                        <p class="text-muted small">{{ item.description|truncatechars:100 }}</p>
                        <p class="fw-bold">₦{{ item.price|intcomma }}</p>
                        <div class="d-flex gap-2">
                            <a href="{% url 'shop:detail' item.slug %}" class="btn btn-outline-primary btn-sm">View</a>
                            <button class="btn btn-primary btn-sm add-to-cart" data-id="{{ item.id }}">Add to
                                cart</button>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
</div>
{% endblock %}
