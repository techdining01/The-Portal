<div class="product-detail-modal">
  <img src="{{ product.get_image_url }}" alt="{{ product.name }}" class="img-fluid mb-2">
  <h5>{{ product.name }}</h5>
  <p>{{ product.description }}</p>
  <div>₦{{ product.price }}</div>
  <button class="btn btn-primary add-to-cart-btn" data-id="{{ product.id }}">Add to Cart</button>
</div>



<script>
    /* after you inject modal HTML into #quickContent */
    async function addToCart(productId, qty=1, studentReg=null) {
  const payload = { product_id: productId, quantity: qty, student_reg: studentReg };
  const res = await fetch("{% url 'shop:add_to_cart' %}", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": "{{ csrf_token }}"
    },
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if (res.ok && json.success) {
    const count = json.cart_item_count || 0;
    document.getElementById("cart-count").innerText = count;
    // quick animation
    gsap.fromTo("#cart-count", {scale:1}, {scale:1.3, duration:0.12, yoyo:true, repeat:1});
    return true;
  } else {
    alert(json.error || "Could not add to cart");
    return false;
  }
}

</script>
