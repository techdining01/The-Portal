{% extends "shop/base.html" %}
{% block content %}
<h4>My orders</h4>
<ul class="list-group">
  {% for o in orders %}
  <li class="list-group-item d-flex justify-content-between align-items-center" data-aos="fade-up">
    <div>
      <strong>{{ o.reference }}</strong> <small>{{ o.created_at }}</small><br>
      Status: <span class="badge bg-{{ 'success' if o.status=='paid' else 'secondary' }}">{{ o.status }}</span>
    </div>
    <div>
      <a class="btn btn-sm btn-outline-primary" href="{{ o.get_receipt_url }}">View receipt</a>
    </div>
  </li>
  {% empty %}
  <li class="list-group-item">No orders yet</li>
  {% endfor %}
</ul>
{% endblock %}
