{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <h2>Checkout</h2>
    <div class="card p-4">
        <p>Total: <strong>₦{{ total }}</strong></p>
        <form method="post">
            {% csrf_token %}
            {% if not request.user.is_authenticated %}
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            {% endif %}
            <button onclick="payWithPaystack()" class="btn btn-lg btn-primary w-100">
                Pay Now
            </button>
            <!-- <button class="btn btn-primary">Pay with Paystack</button> -->
        </form>
    </div>
</div>

<script>
    function payWithPaystack() {
        let handler = PaystackPop.setup({
            key: "{{ public_key }}",
            email: "{{ request.user.email }}",
            amount: {{ total }},
    ref: "{{ order.reference }}", callback: function(response) {
        window.location.href = "/shop/verify/" + response.reference + "/";
    }
    });
    handler.openIframe();
}
</script>



{% endblock %}
