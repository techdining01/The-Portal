<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - {% block title %}School E-commerce{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .sidebar { min-height: calc(100vh - 56px); }
        .admin-sidebar { background-color: #343a40; }
        .admin-sidebar .nav-link { color: #adb5bd; padding: 0.75rem 1rem; }
        .admin-sidebar .nav-link:hover { color: #fff; background-color: #495057; }
        .admin-sidebar .nav-link.active { color: #fff; background-color: #0d6efd; }
        .admin-content { background-color: #f8f9fa; min-height: calc(100vh - 56px); }
        .border-left-primary { border-left: 0.25rem solid #4e73df !important; }
        .border-left-success { border-left: 0.25rem solid #1cc88a !important; }
        .border-left-info { border-left: 0.25rem solid #36b9cc !important; }
        .border-left-warning { border-left: 0.25rem solid #f6c23e !important; }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Admin Navigation -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'ecommerce:admin_dashboard' %}">
                <i class="fas fa-cog"></i> Admin Panel
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'ecommerce:product_list' %}">
                    <i class="fas fa-store"></i> Back to Store
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0">
                <div class="admin-sidebar sidebar">
                    <div class="list-group list-group-flush">
                        <a href="{% url 'ecommerce:admin_dashboard' %}" 
                           class="list-group-item list-group-item-action admin-sidebar nav-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
                            <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                        </a>
                        <a href="{% url 'ecommerce:admin_products' %}" 
                           class="list-group-item list-group-item-action admin-sidebar nav-link {% if 'product' in request.resolver_match.url_name %}active{% endif %}">
                            <i class="fas fa-box me-2"></i> Products
                        </a>
                        <a href="{% url 'ecommerce:admin_orders' %}" 
                           class="list-group-item list-group-item-action admin-sidebar nav-link {% if 'order' in request.resolver_match.url_name %}active{% endif %}">
                            <i class="fas fa-shopping-cart me-2"></i> Orders
                        </a>
                        <a href="{% url 'ecommerce:manage_categories' %}" 
                           class="list-group-item list-group-item-action admin-sidebar nav-link {% if 'category' in request.resolver_match.url_name %}active{% endif %}">
                            <i class="fas fa-tags me-2"></i> Categories
                        </a>
                        <a href="{% url 'ecommerce:backup_management' %}" 
                           class="list-group-item list-group-item-action admin-sidebar nav-link {% if 'backup' in request.resolver_match.url_name %}active{% endif %}">
                            <i class="fas fa-database me-2"></i> Backups
                        </a>
                        <a href="{% url 'ecommerce:audit_logs' %}" 
                           class="list-group-item list-group-item-action admin-sidebar nav-link {% if 'audit' in request.resolver_match.url_name %}active{% endif %}">
                            <i class="fas fa-clipboard-list me-2"></i> Audit Logs
                        </a>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 admin-content">
                <div class="container-fluid py-4">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
