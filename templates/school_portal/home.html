{% extends "cbt_base.html" %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{SCHOOL_NAME}}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f7f9fb; }
    header {
      background: linear-gradient(135deg, #004aad, #0077ff);
      color: white;
      text-align: center;
      padding: 50px 20px;
    }
    header img {
      width: 200px;
      /* border-radius: 50%; */ 
      /*border: 4px solid white;*/
      margin-bottom: 15px;
    }
    .section {
      padding: 60px 0;
    }
  </style>
</head>
<body>
  <header>
    <img src="{% static 'images/school_logo.png' %}" alt="School Logo">
    <h1>{{SCHOOL_NAME}}</h1>
    <p>{{SCHOOL_SLOGAN}}</p>
  </header>

  <section class="section text-center">
    <div class="container">
      <h2>Welcome to Our School Portal</h2>
      <p class="lead">Register, pay school fees, buy textbooks, uniforms, and access your online exams all in one place.</p>
      <div class="mt-4">
        <a href="/accounts/login/" class="btn btn-primary btn-lg me-2">Login</a>
        <a href="/accounts/signup/" class="btn btn-outline-primary btn-lg">Register</a>
      </div>
    </div>
  </section>
</body>
</html>
