{% extends "base.html" %}
{% block content %}
<div class="card p-3" data-aos="zoom-in">
  <h5>Pickup verification</h5>
  <div id="pickupInfo"></div>
  <div id="verifyActions" class="mt-3"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadCode(){
  const code = location.pathname.split("/").filter(Boolean).pop();
  const res = await fetch("{% url 'pickup:pickup_verify' code='REPLACE' %}".replace('REPLACE', code));
  const data = await res.json();
  const info = document.getElementById("pickupInfo");
  info.innerHTML = `<p>Parent: ${data.parent}</p><p>Student: ${data.student}</p><p>Bearer: ${data.bearer_name} (${data.bearer_phone})</p><p>Code: ${data.code}</p><p>Expires: ${data.expires_at}</p>`;
  const actions = document.getElementById("verifyActions");
  if(!data.verified && {{ request.user.is_authenticated|yesno:"true,false" }}){
    actions.innerHTML = `<button id="verifyBtn" class="btn btn-success">Verify</button>`;
    document.getElementById("verifyBtn").addEventListener("click", async ()=>{
      const res2 = await fetch("{% url 'pickup:pickup_verify' code='REPLACE' %}".replace('REPLACE', code), {method:"POST", headers:{'X-CSRFToken':'{{ csrf_token }}'}});
      const r2 = await res2.json();
      if(r2.ok) actions.innerHTML = `<div class="alert alert-success">Verified at ${r2.verified_at}</div>`;
    });
  }
}
loadCode();
</script>
{% endblock %}
