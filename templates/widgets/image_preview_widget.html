<!-- templates/widgets/image_preview_widget.html -->
{% if widget.is_initial %}
    <div class="mb-2">
        <img src="{{ widget.value.url }}" 
             alt="Current image" 
             class="img-thumbnail" 
             style="max-height: 200px;">
    </div>
    {% if not widget.required %}
        <div class="form-check">
            <input type="checkbox" 
                   name="{{ widget.checkbox_name }}" 
                   id="{{ widget.checkbox_id }}" 
                   class="form-check-input">
            <label for="{{ widget.checkbox_id }}" class="form-check-label">
                {{ widget.clear_checkbox_label }}
            </label>
        </div>
    {% endif %}
{% endif %}

<input type="{{ widget.type }}" 
       name="{{ widget.name }}" 
       {% include "forms/widgets/attrs.html" %}>
