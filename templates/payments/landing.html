{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ SCHOOL_NAME }} — Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/">
      <img src="{% static 'images/logo.png' %}" alt="{{ SCHOOL_NAME }}" style="height:60px">
      <span class="ms-2">{{ SCHOOL_NAME }}</span>
    </a>
    <div>
      <a class="btn btn-outline-primary" href="#login">Login</a>
      <a class="btn btn-primary" href="{% url 'payments:payment_dashboard' %}">Admin</a>
    </div>
  </div>
</nav>
<section class="py-5">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-7">
        <h1>Welcome to {{ SCHOOL_NAME }}</h1>
        <p class="lead">{{ SCHOOL_SLOGAN }}</p>
        <p><a class="btn btn-primary" href="{% url 'payments:payment_dashboard' %}">Manage Payments</a></p>
      </div>
      <div class="col-md-5">
        <div class="card p-4">
          <h5>Login</h5>
          <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-2"><input class="form-control" name="username" placeholder="Username"></div>
            <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="Password"></div>
            <button class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
<footer class="text-center py-3">© {{ SCHOOL_NAME }}</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
